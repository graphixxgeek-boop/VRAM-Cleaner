name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: VRAM Zero version
      placeholder: "2.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU model and driver version
      placeholder: "RTX 4070 Ti, driver 5xx.xx"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: smi
    attributes:
      label: Output of nvidia-smi
      description: Run `nvidia-smi` in a terminal and paste the result.
      render: text
